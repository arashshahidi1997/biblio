[workspace]
name = "biblio"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.13"
poppler = "*"          # pdfimages / pdftoppm for `biblio figures`

[pypi-dependencies]
biblio-tools = { path = ".", editable = true, extras = ["openalex", "zotero"] }

# Dev feature — build/test tooling for this package. Run with `pixi run -e dev`.
[feature.dev.pypi-dependencies]
pytest = "*"
build = "*"
twine = "*"
fastapi = ">=0.115"    # GUI tests (biblio-tools[ui])
uvicorn = ">=0.30"
python-multipart = "*"
httpx = "*"
pillow = "*"           # figures integration test

[feature.dev.tasks]
test     = "python -m pytest tests -q"
build    = "python -m build"
check    = "python -m twine check dist/*"
ui-serve = "biblio ui serve"
clean    = "python -c \"import shutil, glob; [shutil.rmtree(p, ignore_errors=True) for p in ['build', 'dist', 'site', '.pytest_cache', *glob.glob('src/*.egg-info')]]\""

# Docs feature: the MkDocs site. Run with `pixi run -e docs docs` (or docs-serve).
[feature.docs.pypi-dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocs-monorepo-plugin = "*"
mkdocs-ezlinks-plugin = "*"

[feature.docs.tasks]
docs       = "python -m mkdocs build --strict"
docs-serve = "python -m mkdocs serve"

# Frontend feature: the React UI built into src/biblio/static/. Run with `pixi run -e frontend build-frontend`.
[feature.frontend.dependencies]
nodejs = ">=20"

[feature.frontend.tasks]
build-frontend = { cmd = "npm ci && npx vite build", cwd = "frontend" }

# Docling feature: the PDF converter biblio runs (`docling.cmd`), pinned so every project and
# pool converts with the same version (R48). 2.64.1 is what the shared pools were made with
# (conda env `rag`). CPU torch: gamma2 has no GPU. Lean env, without biblio itself. From any
# project: docling.cmd: ["pixi", "run", "--manifest-path", "<biblio>/pixi.toml", "-e", "docling", "docling"]
[feature.docling]
platforms = ["linux-64", "osx-arm64"]

[feature.docling.dependencies]
python = "3.11.*"

[feature.docling.pypi-dependencies]
docling = "==2.64.1"
docling-core = "==2.55.0"         # the companions too: they set layout and text
docling-ibm-models = "==3.10.3"
docling-parse = "==4.7.2"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[environments]
default  = { features = [] }
dev      = { features = ["dev"] }
docs     = { features = ["docs"] }
frontend = { features = ["frontend"] }
docling  = { features = ["docling"], no-default-feature = true }

[tasks]
# Tasks live in the features above: `pixi task list`. Saving and pushing are
# `datalad save -m "..."` and `datalad push --to github` (see the projio-remotes skill).
