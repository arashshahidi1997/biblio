# Fixed paper sets for the knowledge-graph comparison.
#
# Only citekeys live here. Paper content is read from $KG_CORPUS_ROOT
# (a projio project with bib/derivatives/). See common/corpus.py.
#
# Test project: a sleep study of hippocampal-cortical coupling
# (sharp-wave ripples, spindles, slow oscillations / up-down states,
# infra-slow modulation). Its hypotheses H1-H8 live in the project's
# plan/questions.yml; the competency questions refer to them.

version: 1

sets:
  # Papers cited by the project's hypotheses. Small enough to hand-annotate.
  core:
    - sirota_2003_CommunicationNeocortex          # H1
    - isomura_2006_IntegrationSegregation         # H1
    - siapas_1998_CoordinatedInteractions         # H2
    - pedrosa_2024_HippocampalRipples             # H2, H4, H6
    - swanson_2025_TopographyPutative             # H3
    - robinson_2025_LargeSharpwave                # H3
    - battaglia_2004_HippocampalSharp             # H4
    - peyrache_2011_InhibitionRecruitment         # H4
    - pedrosa_2022_HippocampalGamma               # H5
    - maingret_2016_HippocampocorticalCoupling    # H6, H7
    - osorioforero_2021_NoradrenergicCircuit      # H8 (docling only: no GROBID / OpenAlex yet)
    - garcia-cortadella_2024_LargescaleInfraslow  # H8

  # Every paper with docling + OpenAlex derivatives and a GROBID folder (snapshot 2026-10-12).
  # 34 of 38 have TEI; the GROBID folders of beest_2024, jain_2025, laquitaine_2024
  # and pachitariu_2024 are empty. Battaglia_2004_Hippocampal is left out: same DOI
