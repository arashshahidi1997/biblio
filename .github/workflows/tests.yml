name: tests

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install biblio with its test extras
        run: uv pip install -e ".[test,openalex,zotero]"
      - name: Run the tests
        run: python -m pytest -q

  e2e-docling:
    # init -> PDF -> docling -> quotes check with the pinned docling (the `docling` extra, CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          activate-environment: true
      - name: Install biblio with docling
        run: >
          uv pip install -e ".[test,docling]"
          --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Run the end-to-end test
        env:
          BIBLIO_E2E: "1"
        run: python -m pytest -q tests/test_e2e_docling.py
